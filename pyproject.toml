# Dev tooling only. The app itself needs nothing beyond the Python 3.10+ standard library.

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# ruff format keeps code within line-length; what is left over is long strings (regexes, usage lines, messages)
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# webapp.py puts its own folder on sys.path before importing the project modules (double-click start on Windows)
"webapp.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
